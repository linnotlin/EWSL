name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Build
        shell: bash
        run: |
          ZIG=zig ./build-zig.sh
          ls -l dist/

      - name: Verify PE structure and icon resources
        shell: pwsh
        run: |
          $exe = 'dist/EWSL.exe'
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $fs = [IO.File]::OpenRead($exe)
          $br = New-Object IO.BinaryReader($fs)
          $fs.Position = 0x3c
          $pe = $br.ReadInt32()
          $fs.Position = $pe
          if ($br.ReadUInt32() -ne 0x00004550) { throw 'bad PE signature' }
          # IMAGE_FILE_MACHINE_AMD64, PE32+
          if ($br.ReadUInt16() -ne 0x8664) { throw 'not x86_64' }
          $fs.Position = $pe + 24
          if ($br.ReadUInt16() -ne 0x020b) { throw 'not PE32+' }
          $fs.Close()
          "size = $((Get-Item $exe).Length) bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EWSL-exe
          path: dist/EWSL.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EWSL.exe
          generate_release_notes: true
