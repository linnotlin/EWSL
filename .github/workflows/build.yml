name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 新仓库给 GITHUB_TOKEN 的默认权限是只读，不显式要写权限的话，
# tag 触发那一档的 action-gh-release 会 403。
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      # tools/make-rsrc.py 用 Pillow 把 icon.jpg 重编码成 12 档 RT_ICON。
      # runner 上没有预装，缺了它会 import 失败，而 build-zig.sh 带 set -e，
      # 整个构建会直接挂在这一步。
      - name: Install Pillow
        shell: bash
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build
        shell: bash
        run: |
          ZIG=zig bash ./build-zig.sh
          ls -l dist/

      - name: Verify PE structure and icon resources
        shell: pwsh
        run: |
          $exe = 'dist/EWSL.exe'
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $fs = [IO.File]::OpenRead($exe)
          $br = New-Object IO.BinaryReader($fs)
          $fs.Position = 0x3c
          $pe = $br.ReadInt32()
          $fs.Position = $pe
          if ($br.ReadUInt32() -ne 0x00004550) { throw 'bad PE signature' }
          # IMAGE_FILE_MACHINE_AMD64, PE32+
          if ($br.ReadUInt16() -ne 0x8664) { throw 'not x86_64' }
          $fs.Position = $pe + 24
          if ($br.ReadUInt16() -ne 0x020b) { throw 'not PE32+' }

          # Walk the section table for .rsrc. tools/make-rsrc.py packs the twelve
          # icon sizes in there (~279 KB); a build that skipped it - python or
          # Pillow missing - has no .rsrc at all, which is easy to miss because
          # the exe still runs. Catch it here.
          #
          # This only proves the resources are present, not that the group
          # directory is laid out right -- a wrong entry stride still yields a
          # full-size .rsrc and an icon that merely looks blurry. make-rsrc.py
          # asserts the stride itself.
          $fs.Position = $pe + 6
          $sections = $br.ReadUInt16()
          $fs.Position = $pe + 4 + 16
          $optSize = $br.ReadUInt16()
          $fs.Position = $pe + 4 + 20 + $optSize
          $rsrc = 0
          for ($i = 0; $i -lt $sections; $i++) {
            $name = [Text.Encoding]::ASCII.GetString($br.ReadBytes(8)).Trim([char]0)
            $fs.Position += 8                       # VirtualSize, VirtualAddress
            $raw = $br.ReadUInt32()                 # SizeOfRawData
            $fs.Position += 20
            if ($name -eq '.rsrc') { $rsrc = $raw }
          }
          $fs.Close()
          if ($rsrc -lt 100000) { throw ".rsrc is ${rsrc} bytes - icon resources did not get embedded" }
          "size = $((Get-Item $exe).Length) bytes, .rsrc = $rsrc bytes, sections = $sections"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EWSL-exe
          path: dist/EWSL.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EWSL.exe
          generate_release_notes: true
